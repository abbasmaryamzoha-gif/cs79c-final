
AWSTemplateFormatVersion: '2010-09-09'
Description: VPC with public subnet and EC2 Apache web server

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: EC2 instance type

Resources:

  # VPC
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: cs79c-vpc

  # Public Subnets
  MySubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: 'us-west-2a' 

  MySubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: 'us-west-2b'


  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MaryamIGW

  # Attach Internet Gateway to VPC
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway

  # Public Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: MaryamPublicRouteTable

  # Default Route to Internet Gateway
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Associate Route Table with Public Subnets
  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MySubnet
      RouteTableId: !Ref PublicRouteTable
    
  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref MySubnet2
      RouteTableId: !Ref PublicRouteTable



  # Security Group - Allow HTTP
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP traffic
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: WebServerSG

  # LAUNCH TEMPLATE:
  WebServer:
      Type: AWS::EC2::LaunchTemplate
      Properties:
        LaunchTemplateName: ServerTemplate
        LaunchTemplateData:
          InstanceType: !Ref InstanceType
          ImageId: !Sub
            - '{{resolve:ssm:${AmiParameter}}}'
            - AmiParameter: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
          SecurityGroupIds:
            - !Ref WebServerSecurityGroup
          UserData:
            Fn::Base64: !Sub |
              #!/bin/bash
              dnf update -y
              dnf install -y httpd
              systemctl enable --now httpd
              echo '<h1>Maryam Abbas Final Project!</h1>' > /var/www/html/index.html
          TagSpecifications:
            - ResourceType: instance
              Tags:
                - Key: Name
                  Value: WebServer



#ALB:
  myALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: my-application-load-balancer
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref MySubnet
        - !Ref MySubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to the load balancer
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref myALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref myTargetGroup
 
 
 #ASG
 #SOURCE: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/quickref-ec2-auto-scaling.html
  myASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref MySubnet
        - !Ref MySubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref WebServer
        Version: !GetAtt WebServer.LatestVersionNumber
      MaxSize: '4'
      MinSize: '1'
      


  myTargetGroup:
      Type: AWS::ElasticLoadBalancingV2::TargetGroup
      Properties:
        Name: my-target-group
        Protocol: HTTP
        Port: 80
        TargetType: instance
        VpcId: !Ref MyVPC
        HealthCheckProtocol: HTTP
        HealthCheckPath: /

Outputs:
    SiteURL:
      Value: !Sub
        - 'http://${LoadBalancerDNS}'
        - LoadBalancerDNS: !GetAtt myALB.DNSName
